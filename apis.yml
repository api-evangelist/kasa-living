aid: kasa-living
name: Kasa Living
description: 'Kasa Living, Inc. (operating as Kasa) is a San Francisco-founded, tech-enabled
  hospitality company that partners with institutional real-estate owners to convert
  multifamily, single-family and hotel inventory into professionally managed, apartment-style
  flexible accommodations across 90+ U.S. cities. Founded in 2016 by Roman Pedan, Kasa
  runs a proprietary hospitality operating system covering dynamic pricing, automated
  operations, keyless self check-in and a 24/7 remote "Virtual Front Desk" instead of
  an on-site front desk, and distributes inventory direct at kasa.com plus through OTAs
  and GDS via the NextPax supply API. Kasa publishes no public developer API, developer
  portal or machine-readable API specification; its one machine-readable, agent-facing
  artifact is a hand-authored llms.txt served at kasa.com/llms.txt.'
